[project]
name = "dependeval"
version = "0.1.0"
description = "DependEval – LLM benchmark for repository dependency understanding + CAST-style ReAct agent"
requires-python = ">=3.10,<3.13"

dependencies = [
    # ── Core data / ML stack ──────────────────────────────────────────────
    "datasets>=3.0.2",
    "fire>=0.7.0",
    "huggingface-hub>=0.26.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "torch>=2.5.1",
    "tqdm>=4.66.5",
    "transformers>=4.46.2",
    "accelerate>=0.26.0",
    # ── LLM API clients ───────────────────────────────────────────────────
    "anthropic>=0.40.0",
    "openai>=1.58.1",
    # ── LangChain (ReAct / CAST agent) ────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    # ── Graph analysis (CAST agent) ───────────────────────────────────────
    "networkx>=3.0",
    # ── Validation / serialisation ────────────────────────────────────────
    "pydantic>=2.0",
    "demjson3",
]

[tool.uv]
python-preference = "managed"
