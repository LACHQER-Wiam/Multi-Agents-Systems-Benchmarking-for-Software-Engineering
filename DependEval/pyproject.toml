[project]
name = "dependeval"
version = "0.1.0"
description = "DependEval – LLM benchmark for repository dependency understanding + CAST-style ReAct agent"
requires-python = ">=3.10,<3.13"

dependencies = [
    # ── Core data / ML stack ──────────────────────────────────────────────
    "datasets>=3.0.2",
    "fire>=0.7.0",
    "huggingface-hub>=0.26.2",
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "torch>=2.5.1",
    "tqdm>=4.66.5",
    "transformers>=4.46.2",
    "accelerate>=0.26.0",
    # ── LLM API clients ───────────────────────────────────────────────────
    "anthropic>=0.40.0",
    "openai>=1.58.1",
    # ── LangChain (ReAct / CAST agent) ────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    # ── Graph analysis (CAST agent) ───────────────────────────────────────
    "networkx>=3.0",
    # ── Validation / serialisation ────────────────────────────────────────
    "pydantic>=2.0",
    "demjson3",
    "swesmith",
    "docker>=7.1.0",
    "python-dotenv>=1.2.1",
    "unidiff>=0.7.5",
    "ghapi>=1.0.13",
    "libcst>=1.8.6",
    "litellm>=1.81.16",
    "swebench>=4.1.0",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-python>=0.25.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-c>=0.24.1",
    "astor>=0.8.1",
    "tree-sitter-ruby>=0.23.1",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
swesmith = { git = "https://github.com/swe-bench/SWE-SMITH.git" }
